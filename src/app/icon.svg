<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29B38" />
      <stop offset="50%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#997724" />
    </linearGradient>
    <linearGradient id="charcoal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1C1A" />
      <stop offset="100%" stop-color="#12100E" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#charcoal)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Roman V Monogram -->
  <path d="M18 18 L32 46 L46 18" stroke="#F5F2EC" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <!-- Central Hairline Spine -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#E0623A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Serif Head Bars -->
  <line x1="14" y1="18" x2="22" y2="18" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="50" y2="18" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower Apex Dot -->
  <circle cx="32" cy="49" r="1.5" fill="#E0623A"/>
</svg>
